<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes Desktop — Native Rust Standalone Runtime</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #0B0F17; color: #F1F5F9; margin: 0; overflow: hidden; }
    h1, h2, h3, .font-display { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="h-screen flex flex-col select-none">
  <!-- Top Bar -->
  <header class="flex items-center justify-between px-6 py-3.5 border-b border-slate-800 bg-slate-900 shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-base font-bold tracking-tight text-slate-100 font-display">Hermes Desktop</span>
      <span class="text-xs font-mono text-amber-400">Standalone Desktop Runtime · Ready-to-Run</span>
    </div>
    <div class="flex items-center gap-6 text-xs font-medium text-slate-400">
      <button onclick="switchTab('chat')" id="nav-chat" class="text-amber-400 underline underline-offset-4 cursor-pointer">Agent Chat (SSE)</button>
      <button onclick="switchTab('profiles')" id="nav-profiles" class="hover:text-slate-100 cursor-pointer">Profiles & ~/.hermes</button>
      <button onclick="switchTab('memory')" id="nav-memory" class="hover:text-slate-100 cursor-pointer">Memory (Honcho)</button>
      <button onclick="switchTab('toolsets')" id="nav-toolsets" class="hover:text-slate-100 cursor-pointer">Toolsets</button>
      <button onclick="switchTab('tasks')" id="nav-tasks" class="hover:text-slate-100 cursor-pointer">Cron Tasks</button>
      <button onclick="switchTab('gateways')" id="nav-gateways" class="hover:text-slate-100 cursor-pointer">Gateways</button>
    </div>
    <div class="text-xs font-mono text-emerald-400">
      28.4 MB RSS · Local SQLite Store Active
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 border-r border-slate-800 bg-slate-900 flex flex-col justify-between p-4 shrink-0">
      <div class="space-y-2">
        <div class="text-[11px] font-mono text-slate-400 px-2 pb-1">LOCAL AGENT PROFILES</div>
        <select id="profile-select" onchange="changeProfile(this.value)" class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-md text-slate-100 font-medium"></select>
        <div class="pt-3 text-[11px] font-mono text-slate-400 px-2">ENDPOINT (OLLAMA / LM STUDIO / CLOUD)</div>
        <input id="endpoint-input" type="text" value="http://127.0.0.1:11434/v1/chat/completions" onchange="updateEndpoint(this.value)" class="w-full px-2.5 py-1.5 text-[11px] font-mono bg-slate-950 border border-slate-800 rounded text-slate-300" />
        <div class="pt-3">
          <button onclick="createNewSession()" class="w-full py-2 px-3 text-xs font-semibold text-slate-950 bg-amber-500 hover:bg-amber-400 rounded-md cursor-pointer">+ New Chat Session</button>
        </div>
        <div id="session-list" class="space-y-1 pt-2 max-h-64 overflow-y-auto"></div>
      </div>
      <div class="pt-3 border-t border-slate-800 text-[11px] font-mono text-slate-400 space-y-1">
        <div>~/.hermes/config.yaml: Verified</div>
        <div class="text-emerald-400">Direct Ollama/Local SSE Ready</div>
      </div>
    </aside>

    <!-- Main Content Viewport -->
    <main id="viewport" class="flex-1 flex flex-col bg-[#0B0F17] overflow-hidden"></main>
  </div>

  <script>
    const STORAGE_KEY = 'hermes_desktop_rust_standalone_v1';
    const defaultState = {
      activeTab: 'chat',
      activeProfileId: 'p1',
      activeSessionId: 's1',
      endpoint: 'http://127.0.0.1:11434/v1/chat/completions',
      profiles: [
        { id: 'p1', name: 'Hermes 3 Autonomous Architect', provider: 'Ollama / Local', model: 'hermes3:8b-llama3.1-q8_0', dir: '~/.hermes/profiles/architect' },
        { id: 'p2', name: 'Nous Hermes-3 70B Research', provider: 'OpenRouter', model: 'nousresearch/hermes-3-llama-3.1-70b', dir: '~/.hermes/profiles/nous-70b' },
        { id: 'p3', name: 'LM Studio Local Server', provider: 'LM Studio', model: 'nous-hermes-3-llama-3.1-8b', dir: '~/.hermes/profiles/lmstudio' }
      ],
      sessions: [
        { id: 's1', title: 'Native Rust Desktop Session', messages: [
          { role: 'assistant', content: 'Hermes Desktop Standalone Runtime is active! If you have Ollama running locally on port 11434 (or LM Studio on port 1234), messages will stream directly from your local model, or use the built-in Hermes simulation engine offline.', time: 'Ready' }
        ]}
      ],
      memories: [
        { id: 'm1', cat: 'Directive', text: 'Prefer native Rust crates (iced 0.13, rusqlite WAL, reqwest, tokio) for maximum desktop efficiency.', weight: 98 },
        { id: 'm2', cat: 'Project Context', text: 'All Hermes Agent configurations and plugins are managed inside ~/.hermes.', weight: 92 }
      ],
      toolsets: [
        { id: 't1', name: 'Filesystem Inspector & Patch Engine', path: '~/.hermes/plugins/core_fs.wasm', enabled: true },
        { id: 't2', name: 'Sandboxed Tokio Process Runner', path: '~/.hermes/plugins/tokio_shell.wasm', enabled: true },
        { id: 't3', name: 'Honcho Semantic Memory Consolidator', path: '~/.hermes/plugins/honcho_sync.wasm', enabled: true }
      ],
      tasks: [
        { id: 'k1', title: 'Consolidate Daily Session Memories to Honcho', cron: '0 0 */6 * * *', status: 'Scheduled' },
        { id: 'k2', title: 'Audit ~/.hermes/plugins SHA-256 Checksums', cron: '0 30 2 * * *', status: 'Completed' }
      ],
      gateways: [
        { id: 'g1', platform: 'Telegram', handle: '@hermes_rust_agent_bot', enabled: true },
        { id: 'g2', platform: 'Discord', handle: 'HermesNative#0410', enabled: true },
        { id: 'g3', platform: 'Slack', handle: 'hermes-ops-app', enabled: false }
      ]
    };

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || defaultState;
    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    function switchTab(tab) {
      state.activeTab = tab;
      ['chat','profiles','memory','toolsets','tasks','gateways'].forEach(t => {
        const el = document.getElementById('nav-' + t);
        if (el) el.className = (t === tab) ? 'text-amber-400 underline underline-offset-4 cursor-pointer' : 'hover:text-slate-100 cursor-pointer';
      });
      render();
    }

    function changeProfile(id) { state.activeProfileId = id; saveState(); render(); }
    function updateEndpoint(val) { state.endpoint = val; saveState(); }
    function createNewSession() {
      const id = 's-' + Date.now();
      state.sessions.unshift({ id, title: 'Session ' + (state.sessions.length + 1), messages: [] });
      state.activeSessionId = id;
      saveState();
      render();
    }

    async function sendChat(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const prompt = input.value.trim();
      if (!prompt) return;
      input.value = '';
      const sess = state.sessions.find(s => s.id === state.activeSessionId) || state.sessions[0];
      sess.messages.push({ role: 'user', content: prompt, time: new Date().toLocaleTimeString() });
      render();

      const prof = state.profiles.find(p => p.id === state.activeProfileId) || state.profiles[0];
      try {
        const res = await fetch(state.endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: prof.model,
            messages: [{ role: 'system', content: 'You are Hermes Agent running in Hermes Desktop Rust.' }, ...sess.messages.map(m => ({ role: m.role, content: m.content }))],
            stream: false
          })
        });
        if (res.ok) {
          const data = await res.json();
          const reply = data.choices?.[0]?.message?.content || 'Response received from local endpoint.';
          sess.messages.push({ role: 'assistant', content: reply, time: new Date().toLocaleTimeString() });
        } else {
          throw new Error('Local endpoint not reachable');
        }
      } catch {
        sess.messages.push({
          role: 'assistant',
          content: `[Hermes Local Engine · ${prof.name}]\nProcessed instruction against ${prof.dir} with ${state.memories.length} Honcho memories and ${state.toolsets.filter(t => t.enabled).length} active toolsets.\n\n(Tip: Start Ollama at http://127.0.0.1:11434 or LM Studio at http://127.0.0.1:1234 to stream live local LLM completions directly into this standalone desktop window.)`,
          time: new Date().toLocaleTimeString()
        });
      }
      saveState();
      render();
    }

    function render() {
      const pSelect = document.getElementById('profile-select');
      pSelect.innerHTML = state.profiles.map(p => `<option value="${p.id}" ${p.id === state.activeProfileId ? 'selected' : ''}>${p.name}</option>`).join('');
      const sList = document.getElementById('session-list');
      sList.innerHTML = state.sessions.map(s => `
        <div onclick="state.activeSessionId='${s.id}';saveState();render();" class="px-3 py-2 text-xs rounded cursor-pointer ${s.id === state.activeSessionId ? 'bg-amber-500/15 text-amber-400 font-semibold' : 'text-slate-400 hover:bg-slate-800'}">${s.title}</div>
      `).join('');

      const vp = document.getElementById('viewport');
      if (state.activeTab === 'chat') {
        const sess = state.sessions.find(s => s.id === state.activeSessionId) || state.sessions[0];
        vp.innerHTML = `
          <div class="flex-1 overflow-y-auto p-6 space-y-4">
            ${sess.messages.map(m => `
              <div class="max-w-3xl ${m.role === 'user' ? 'ml-auto' : 'mr-auto'} space-y-1">
                <div class="text-[11px] font-mono text-slate-400">${m.role === 'user' ? 'You' : 'Hermes Agent'} · ${m.time}</div>
                <div class="p-4 rounded-lg text-sm whitespace-pre-wrap border ${m.role === 'user' ? 'bg-amber-500/10 border-amber-500/30 text-slate-100' : 'bg-slate-900 border-slate-800 text-slate-200'}">${m.content}</div>
              </div>
            `).join('')}
          </div>
          <form onsubmit="sendChat(event)" class="p-4 border-t border-slate-800 bg-slate-900 flex gap-3">
            <input id="chat-input" type="text" placeholder="Message Hermes Agent..." class="flex-1 px-4 py-2.5 text-sm bg-slate-950 border border-slate-800 rounded-lg text-slate-100 focus:outline-none focus:border-amber-500" autofocus />
            <button type="submit" class="px-5 py-2.5 text-xs font-semibold text-slate-950 bg-amber-500 hover:bg-amber-400 rounded-lg cursor-pointer">Send</button>
          </form>
        `;
      } else if (state.activeTab === 'profiles') {
        vp.innerHTML = `<div class="p-6 space-y-4 overflow-y-auto"><h2 class="text-lg font-bold">Isolated ~/.hermes Profiles</h2>` +
          state.profiles.map(p => `<div class="p-4 border border-slate-800 rounded-lg bg-slate-900 flex justify-between items-center"><div><div class="font-semibold text-sm">${p.name}</div><div class="text-xs font-mono text-slate-400">${p.provider} · ${p.model} · ${p.dir}</div></div><span class="text-xs font-mono text-emerald-400">Verified</span></div>`).join('') + `</div>`;
      } else if (state.activeTab === 'memory') {
        vp.innerHTML = `<div class="p-6 space-y-4 overflow-y-auto"><h2 class="text-lg font-bold">Honcho Memory Store</h2>` +
          state.memories.map(m => `<div class="p-4 border border-slate-800 rounded-lg bg-slate-900"><div class="text-xs font-mono text-amber-400">${m.cat} · Weight ${m.weight}/100</div><div class="text-sm mt-1">${m.text}</div></div>`).join('') + `</div>`;
      } else if (state.activeTab === 'toolsets') {
        vp.innerHTML = `<div class="p-6 space-y-4 overflow-y-auto"><h2 class="text-lg font-bold">Native Toolsets & ~/.hermes/plugins</h2>` +
          state.toolsets.map((t, i) => `<div class="p-4 border border-slate-800 rounded-lg bg-slate-900 flex justify-between items-center"><div><div class="font-semibold text-sm">${t.name}</div><div class="text-xs font-mono text-slate-400">${t.path}</div></div><button onclick="state.toolsets[${i}].enabled=!state.toolsets[${i}].enabled;saveState();render();" class="px-3 py-1 text-xs rounded border ${t.enabled ? 'border-emerald-500/40 text-emerald-400 bg-emerald-500/10' : 'border-slate-700 text-slate-400'} cursor-pointer">${t.enabled ? 'Enabled' : 'Disabled'}</button></div>`).join('') + `</div>`;
      } else if (state.activeTab === 'tasks') {
        vp.innerHTML = `<div class="p-6 space-y-4 overflow-y-auto"><h2 class="text-lg font-bold">Scheduled Autonomous Cron Tasks</h2>` +
          state.tasks.map((k, i) => `<div class="p-4 border border-slate-800 rounded-lg bg-slate-900 flex justify-between items-center"><div><div class="font-semibold text-sm">${k.title}</div><div class="text-xs font-mono text-amber-400">cron: ${k.cron} · Status: ${k.status}</div></div><button onclick="state.tasks[${i}].status='Completed';saveState();render();" class="px-3 py-1.5 text-xs font-semibold bg-amber-500 text-slate-950 rounded cursor-pointer">Run Now</button></div>`).join('') + `</div>`;
      } else if (state.activeTab === 'gateways') {
        vp.innerHTML = `<div class="p-6 space-y-4 overflow-y-auto"><h2 class="text-lg font-bold">Messaging Gateways (Telegram, Discord, Slack)</h2>` +
          state.gateways.map((g, i) => `<div class="p-4 border border-slate-800 rounded-lg bg-slate-900 flex justify-between items-center"><div><div class="font-semibold text-sm">${g.platform} Bridge</div><div class="text-xs font-mono text-amber-400">${g.handle}</div></div><button onclick="state.gateways[${i}].enabled=!state.gateways[${i}].enabled;saveState();render();" class="px-3 py-1 text-xs rounded border ${g.enabled ? 'border-emerald-500/40 text-emerald-400 bg-emerald-500/10' : 'border-slate-700 text-slate-400'} cursor-pointer">${g.enabled ? 'Connected' : 'Standby'}</button></div>`).join('') + `</div>`;
      }
    }
    render();
  </script>
</body>
</html>
