<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes One Desktop</title>
  <style>
    :root {
      --bg-primary: #212121;
      --bg-secondary: #171717;
      --bg-tertiary: #2f2f2f;
      --bg-elevated: #303030;
      --bg-hover: #3a3a3a;
      --bg-active: #424242;
      --accent: #003f7a;
      --accent-hover: #0055a4;
      --accent-text: #006acd;
      --text-primary: #ececec;
      --text-secondary: #b4b4b4;
      --text-muted: #8e8e8e;
      --border: rgba(255, 255, 255, 0.06);
      --border-bright: rgba(255, 255, 255, 0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --font-sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .layout-shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    .layout { display: flex; flex: 1; min-height: 0; }
    .sidebar {
      width: 220px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 10px 8px;
      flex-shrink: 0;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }
    .sidebar-nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .sidebar-nav-item.active { background: var(--bg-hover); color: var(--text-primary); }
    .sidebar-new-chat { color: var(--text-primary); margin-bottom: 4px; }
    .sidebar-section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 14px 10px 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .sidebar-chats { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-footer-actions { display: flex; justify-content: space-between; padding: 0 4px; }
    .sidebar-footer-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
    }
    .sidebar-footer-btn:hover, .sidebar-footer-btn.active {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }
    .profile-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      background: var(--bg-tertiary);
      font-size: 12.5px;
      cursor: pointer;
    }
    .profile-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
    }
    .content { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-primary); }
    .active-sessions-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .session-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .session-chip.active {
      background: var(--bg-primary);
      color: var(--text-primary);
      border-color: var(--border-bright);
    }
    .chat-container { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .chat-empty {
      margin: auto;
      text-align: center;
      max-width: 560px;
      padding: 32px 16px;
    }
    .chat-empty-text { font-size: 22px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
    .chat-empty-hint { font-size: 13.5px; color: var(--text-muted); margin-bottom: 22px; }
    .chat-suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chat-suggestion {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-bright);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      font-size: 12.5px;
      cursor: pointer;
    }
    .chat-suggestion:hover { background: var(--bg-hover); color: var(--text-primary); }
    .msg-row { display: flex; margin-bottom: 14px; }
    .msg-row.user { justify-content: flex-end; }
    .msg-bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .msg-row.user .msg-bubble { background: var(--accent); color: #fff; }
    .msg-row.agent .msg-bubble { background: var(--bg-tertiary); color: var(--text-primary); }
    .chat-input-area { padding: 12px 24px 18px; max-width: 820px; width: 100%; margin: 0 auto; }
    .chat-input-wrapper {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-lg);
      padding: 10px 12px;
    }
    .chat-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      resize: none;
      min-height: 26px;
    }
    .chat-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }
    .send-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }
    .status-bar {
      height: 26px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="layout-shell">
    <div class="layout">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <button class="sidebar-nav-item sidebar-new-chat" onclick="newChat()">+ &nbsp;New Chat</button>
          <button class="sidebar-nav-item" onclick="switchPane('discover')">&#9678; &nbsp;Discover</button>
          <button class="sidebar-nav-item" onclick="switchPane('office')">&#9635; &nbsp;Office</button>
          <button class="sidebar-nav-item" onclick="switchPane('kanban')">&#9776; &nbsp;Kanban</button>
          <button class="sidebar-nav-item" onclick="switchPane('schedules')">&#9201; &nbsp;Schedules</button>
        </nav>
        <div class="sidebar-section-label">Chats</div>
        <div class="sidebar-chats" id="sidebarChats"></div>
        <div class="sidebar-footer">
          <div class="sidebar-footer-actions">
            <button class="sidebar-footer-btn" title="Providers" onclick="switchPane('providers')">Key</button>
            <button class="sidebar-footer-btn" title="Gateway" onclick="switchPane('gateway')">Gwy</button>
            <button class="sidebar-footer-btn" title="Capabilities" onclick="switchPane('tools')">Cap</button>
            <button class="sidebar-footer-btn" title="Memory" onclick="switchPane('memory')">Mem</button>
            <button class="sidebar-footer-btn" title="Profiles" onclick="switchPane('agents')">Prf</button>
          </div>
          <div class="profile-bar" onclick="switchPane('agents')">
            <span class="profile-avatar">D</span>
            <span>default</span>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="active-sessions-bar" id="sessionTabs"></div>
        <div class="chat-container" id="mainPane"></div>
      </main>
    </div>

    <footer class="status-bar">
      <div><span class="status-dot"></span><strong>gateway</strong> &middot; local &middot; hermes-3-llama-3.1-405b &middot; 12 skills</div>
      <div>/ commands &middot; Ctrl, settings</div>
    </footer>
  </div>

  <script>
    const state = {
      sessions: [
        { id: 's1', title: 'New Chat', messages: [] },
        { id: 's2', title: 'Workspace setup & tool configuration', messages: [
          { role: 'user', content: 'Check my active toolsets and verify ~/.hermes/config.yaml.' },
          { role: 'agent', content: 'Verified ~/.hermes/config.yaml: terminal, filesystem, web_search, and memory_recall toolsets are enabled.' }
        ]}
      ],
      activeSessionId: 's1'
    };

    function render() {
      const chatList = document.getElementById('sidebarChats');
      chatList.innerHTML = state.sessions.map(s => `
        <button class="sidebar-nav-item ${s.id === state.activeSessionId ? 'active' : ''}" onclick="selectSession('${s.id}')">
          ${s.title}
        </button>
      `).join('');

      const tabs = document.getElementById('sessionTabs');
      tabs.innerHTML = state.sessions.map(s => `
        <button class="session-chip ${s.id === state.activeSessionId ? 'active' : ''}" onclick="selectSession('${s.id}')">
          ${s.title}
        </button>
      `).join('') + `<button class="session-chip" onclick="newChat()">+</button>`;

      const active = state.sessions.find(s => s.id === state.activeSessionId) || state.sessions[0];
      const mainPane = document.getElementById('mainPane');

      const messagesHtml = active.messages.length === 0 ? `
        <div class="chat-empty">
          <div class="chat-empty-text">How can I help you today?</div>
          <div class="chat-empty-hint">Ask me to write code, answer questions, search the web, and more</div>
          <div class="chat-suggestions">
            <button class="chat-suggestion" onclick="prefill('Search the web for ')">Search the web</button>
            <button class="chat-suggestion" onclick="prefill('Remind me in 30 minutes to ')">Set a reminder</button>
            <button class="chat-suggestion" onclick="prefill('Check my recent emails and summarize')">Summarize emails</button>
            <button class="chat-suggestion" onclick="prefill('Write a script that ')">Write a script</button>
            <button class="chat-suggestion" onclick="prefill('Set up a daily scheduled task at 9am to ')">Schedule a cron job</button>
            <button class="chat-suggestion" onclick="prefill('Help me analyze and visualize ')">Analyze data</button>
          </div>
        </div>
      ` : active.messages.map(m => `
        <div class="msg-row ${m.role}">
          <div class="msg-bubble">${m.content}</div>
        </div>
      `).join('');

      mainPane.innerHTML = `
        <div class="chat-messages">${messagesHtml}</div>
        <div class="chat-input-area">
          <div class="chat-input-wrapper">
            <textarea id="promptBox" class="chat-input" rows="1" placeholder="Ask anything" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendPrompt();}"></textarea>
            <div class="chat-toolbar">
              <span>hermes-3-llama-3.1-405b &middot; effort: medium</span>
              <button class="send-btn" onclick="sendPrompt()">&uarr;</button>
            </div>
          </div>
        </div>
      `;
    }

    function selectSession(id) { state.activeSessionId = id; render(); }
    function newChat() {
      const id = 's' + Date.now();
      state.sessions.unshift({ id, title: 'New Chat', messages: [] });
      state.activeSessionId = id;
      render();
    }
    function prefill(txt) {
      const el = document.getElementById('promptBox');
      if (el) { el.value = txt; el.focus(); }
    }
    function switchPane(name) {
      render();
    }
    async function sendPrompt() {
      const el = document.getElementById('promptBox');
      if (!el || !el.value.trim()) return;
      const text = el.value.trim();
      const active = state.sessions.find(s => s.id === state.activeSessionId);
      if (active.title === 'New Chat') active.title = text.slice(0, 36);
      active.messages.push({ role: 'user', content: text });
      render();
      try {
        const res = await fetch('http://127.0.0.1:11434/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'hermes3:8b',
            messages: [{ role: 'user', content: text }]
          })
        });
        if (res.ok) {
          const data = await res.json();
          active.messages.push({ role: 'agent', content: data.choices?.[0]?.message?.content || 'Done.' });
        } else {
          throw new Error('offline');
        }
      } catch {
        active.messages.push({
          role: 'agent',
          content: 'Processed request in Hermes One Desktop: "' + text + '". (Connect local Ollama at 127.0.0.1:11434 or configure OpenRouter in Providers).'
        });
      }
      render();
    }

    render();
  </script>
</body>
</html>
