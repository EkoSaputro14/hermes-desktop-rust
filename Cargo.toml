[package]
name = "hermes-desktop"
version = "1.0.1"
edition = "2021"
authors = ["Hermes Desktop Rust Contributors"]
description = "Hermes One Desktop — Native Rust GUI (Iced 0.13 + Tokio + rusqlite)"
license = "MIT"
repository = "https://github.com/EkoSaputro14/hermes-desktop-rust"

[dependencies]
# Native GPU-accelerated Elm-architecture GUI with SVG vector icon support
iced = { version = "0.13.1", features = ["tokio", "svg"] }

# Async runtime & process orchestration
tokio = { version = "1.42.0", features = ["full"] }
futures = "0.3.31"

# Embedded SQLite with bundled C library
rusqlite = { version = "0.32.1", features = ["bundled"] }

# HTTP & Server-Sent Events streaming
reqwest = { version = "0.12.9", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization & configuration
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"

# Utilities, paths, timestamps & structured diagnostics
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
dirs = "5.0.1"
anyhow = "1.0.93"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
