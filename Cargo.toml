[package]
name = "hermes-desktop"
version = "0.4.0"
edition = "2021"
authors = ["Hermes Desktop Rust Contributors"]
description = "Native Rust GUI companion for NousResearch Hermes Agent — Iced + Tokio + rusqlite edition"
license = "MIT"
repository = "https://github.com/fathah/hermes-desktop"

[dependencies]
# Native GPU-accelerated Elm-architecture GUI (replaces Electron + Chromium)
iced = { version = "0.13.1", features = ["tokio", "advanced", "svg", "markdown", "canvas"] }
iced_aw = { version = "0.11.0", default-features = false, features = ["badge", "card", "modal", "tabs"] }

# Async runtime & process orchestration (replaces Node.js main process & IPC)
tokio = { version = "1.42.0", features = ["full", "process", "sync", "time", "fs"] }
futures = "0.3.31"
async-stream = "0.3.6"

# Embedded SQLite with bundled C library (replaces better-sqlite3)
rusqlite = { version = "0.32.1", features = ["bundled", "chrono", "serde_json", "uuid"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.25.0"

# HTTP & Server-Sent Events streaming for 11+ LLM providers
reqwest = { version = "0.12.9", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
reqwest-eventsource = "0.6.0"

# Cron task scheduling & autonomous background jobs
tokio-cron-scheduler = "0.13.0"
cron = "0.13.0"

# Serialization & configuration (~/.hermes/config.yaml & plugins)
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
serde_yaml = "0.9.34"

# Utilities, paths, timestamps & structured diagnostics
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
dirs = "5.0.1"
anyhow = "1.0.93"
thiserror = "2.0.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
